name: Android CI

on:
  push:
    branches: [ "main" ]  # Only trigger on main branch
  pull_request:
    branches: [ "main" ]  # PRs to main
  workflow_dispatch:       # Manual trigger allowed

jobs:
  build:
    runs-on: ubuntu-latest # Latest OS

    steps:
      # Step 1: Checkout code with latest actions
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up JDK 17 (mandatory for modern Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Build Release APK
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Step 4: Upload APK with wildcard path
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hmcl-pe-release
          path: HMCLPE/build/outputs/apk/release/*.apk # Wildcard for any APK
